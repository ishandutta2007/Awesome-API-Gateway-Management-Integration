<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Style for keyframe animations -->
  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes streamDataRev {
      0% { stroke-dashoffset: -120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5px; fill-opacity: 0.6; }
      50% { r: 7.5px; fill-opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 150px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 950px 250px; }
    .data-stream { stroke-dasharray: 8, 16; animation: streamData 3s linear infinite; }
    .data-stream-rev { stroke-dasharray: 8, 16; animation: streamDataRev 3.5s linear infinite; }
    .node-anim-1 { animation: nodePulse 3s ease-in-out infinite; }
    .node-anim-2 { animation: nodePulse 3s ease-in-out infinite 1.5s; }
    .pill-card { animation: badgeFloat 4s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="140" r="180" fill="url(#glowGrad1)" />
  <circle class="orb-2" cx="980" cy="260" r="200" fill="url(#glowGrad2)" />

  <!-- Background Data Flow Architecture Lines (Dynamic Aspect behind text) -->
  <g opacity="0.35">
    <!-- Connecting pathways -->
    <path class="data-stream" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-stream-rev" d="M 50 320 Q 300 380 600 320 T 1150 320" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="data-stream" d="M 120 40 L 280 180 L 120 340" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <path class="data-stream-rev" d="M 1080 40 L 920 180 L 1080 340" fill="none" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Network Topology Nodes -->
    <circle class="node-anim-1" cx="280" cy="180" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="node-anim-2" cx="920" cy="180" r="6" fill="#a855f7" filter="url(#softGlow)" />
    <circle class="node-anim-1" cx="600" cy="80" r="5" fill="#818cf8" />
    <circle class="node-anim-2" cx="600" cy="320" r="5" fill="#38bdf8" />
    <circle cx="120" cy="40" r="4" fill="#64748b" />
    <circle cx="120" cy="340" r="4" fill="#64748b" />
    <circle cx="1080" cy="40" r="4" fill="#64748b" />
    <circle cx="1080" cy="340" r="4" fill="#64748b" />
  </g>

  <!-- Foreground Main Titles & Headings (Guaranteed Foreground) -->
  <g id="foreground-content">
    <!-- Top Pill / Badge -->
    <g class="pill-card" transform="translate(450, 48)">
      <rect width="300" height="32" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#softGlow)" />
      <text x="35" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.8))">
      Awesome API Gateway &amp; APIM
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.2" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.9))">
      Enterprise SaaS Pricing Benchmarks &amp; Open-Source Gateway Solutions
    </text>

    <!-- Tagline description -->
    <text x="600" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Kong • Traefik • Envoy • Apache APISIX • Tyk • AWS • Azure • Apigee • MuleSoft
    </text>

    <!-- Bottom Feature Badges / Highlights -->
    <g transform="translate(240, 280)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⚡ Real Pricing Benchmarks</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(255, 0)">
        <rect width="210" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🛡️ Star-Ranked Open Source</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(510, 0)">
        <rect width="210" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">📊 Market Dynamics &amp; Valuation</text>
      </g>
    </g>
  </g>
</svg>
